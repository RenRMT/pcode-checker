[project]
name = "pcode-data-build"
version = "0.1.0"
description = "Fetch, validate and split the HDX Global P-code List for the p-code checker add-in"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]
# The reference oracle. Heavy, so only installed for fixtures/oracle and evaluation.
eval = ["hdx-python-country>=4.2"]

[tool.uv]
package = false
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
